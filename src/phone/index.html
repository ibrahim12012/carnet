<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1d20">
<title>Carnet · camera</title>
<style>
  :root { --bg: #1c1d20; --panel: #26282c; --text: #e8e9ec; --muted: #9a9ca3; --accent: #00b8a9; --bad: #e5484d; --warn: #f0b429; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; padding: max(12px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom)); gap: 12px; }
  header { display: flex; align-items: center; gap: 10px; }
  header b { font-size: 17px; }
  header > .muted { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #fmt { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
  #status { white-space: nowrap; }
  body.recording #fmt { display: none; }
  #fmt + #status { margin-left: 8px; }
  #status { margin-left: auto; font-size: 13px; padding: 3px 10px; border-radius: 99px; background: var(--panel); color: var(--muted); }
  #status.live { background: rgba(0,184,169,.18); color: var(--accent); }
  #status.warn { background: rgba(240,180,41,.16); color: var(--warn); }
  #status.bad { background: rgba(229,72,77,.16); color: var(--bad); }
  #status.rec { background: rgba(229,72,77,.2); color: #ff8a8d; font-variant-numeric: tabular-nums; }
  #status.rec::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--bad); vertical-align: 1px; }
  .note { margin: 0; font-size: 14px; color: var(--muted); text-align: center; }
  .note.warn { color: var(--warn); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #3a3c42; border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  .stage { position: relative; flex: 1; min-height: 0; background: #000; border-radius: 10px; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; }
  video.mirror { transform: scaleX(-1); }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 22px; text-align: center; gap: 10px; background: var(--bg); }
  #overlay p { margin: 0; max-width: 420px; }
  .muted { color: var(--muted); font-size: 14px; }
  .bar { display: flex; gap: 10px; }
  button { flex: 1; height: 50px; border: 0; border-radius: 10px; font: inherit; font-weight: 600; color: var(--text); background: var(--panel); }
  button.primary { background: var(--accent); color: #062b28; }
  button:disabled { opacity: .45; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <header><b>Carnet</b><span class="muted" data-t>phone camera</span><span id="fmt"></span><span id="status" data-t>Ready</span></header>
  <div class="stage">
    <video id="preview" autoplay muted playsinline class="mirror"></video>
    <div id="overlay">
      <p id="overlayText" data-t>Press <b>Start camera</b>, then start the recording in Carnet, on the computer.</p>
      <p class="muted" data-t>Keep this page open and the screen on while recording. For a long recording, plug the phone in.</p>
    </div>
  </div>
  <p id="recNote" class="note hidden"></p>
  <div class="bar">
    <button id="btnStart" class="primary" data-t>Start camera</button>
    <button id="btnFlip" class="hidden" data-t>Switch camera</button>
    <button id="btnStop" class="hidden" data-t>Stop</button>
  </div>
<script>
'use strict';
// Page served by Carnet on the local network (same idea as OmniCam, github.com/Orest-Z/OmniCam).
// The camera is opened without the microphone, unless Carnet asks this phone to record (see "Recording made by this
// phone" below). Two paths for the picture shown in Carnet:
//  - "fallback": a WebSocket connection on the same path as this page (HTTPS), so it works as soon as the page
//    has opened. The phone sends real video through it, compressed by its own chip (H.264, otherwise VP8):
//    light and smooth. Without WebCodecs, JPEG pictures. If the WebSocket does not open, JPEG pictures over HTTPS.
//  - "direct": WebRTC video, tried at the same time; used only once Carnet confirms it really receives its
//    pictures, and dropped as soon as they stop arriving.
// Text in English; the server adds the strings of the app's language in place of the comment below.
/*I18N*/
const I18N_ = typeof I18N !== 'undefined' ? I18N : { lang: 'en', dict: {} };
const T = (src, v) => { let x = I18N_.dict[src] || src; if (v) x = x.replace(/\{(\w+)\}/g, (m, k) => (v[k] !== undefined ? v[k] : m)); return x; };
document.documentElement.lang = I18N_.lang;
document.querySelectorAll('[data-t]').forEach((el) => { el.innerHTML = T(el.innerHTML.trim()); });
document.title = T(document.title);
const PAGE_VERSION = 7;
const $ = (id) => document.getElementById(id);
const token = new URLSearchParams(location.search).get('t') || '';
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let stream = null, pc = null, sender = null, control = null;
let facing = 'user', want = false, wakeLock = null;
let mode = 'secours';                 // 'secours' ou 'direct' (WebRTC confirmé par Carnet)
let directConfirm = 0, directAttempts = 0, directTimer = null, statusRunning = false;

function status(text, cls) { $('status').textContent = text; $('status').className = cls || ''; }
function overlay(text) {
  $('overlay').classList.toggle('hidden', !text);
  if (text) $('overlayText').innerHTML = text;
}
function showStatus() {
  if (recUi()) return; // a recording (made or being sent) has the status line
  if (!want) return;
  const text = mode === 'direct' ? T('Live') : T('Live (fallback mode)');
  if ($('status').textContent !== text) status(text, 'live');
}
// Page plus ancienne que Carnet : rechargée, et la caméra redémarre toute seule.
function reloadPage() { try { sessionStorage.setItem('carnet.autostart', '1'); } catch (_) {} location.reload(); }

// Camera only (audio: false) while the computer records: its microphone is the one used. When Carnet asks this phone
// to record ("armed"), the microphone is opened with the camera, in the same request (a separate request for the
// microphone can stop the camera on some phones). Microphone refused: the camera alone, and Carnet is told.
// 1920x1080 à 60 images par seconde demandés ; un téléphone qui ne sait pas faire 60 en 1080p donne 30
// (le navigateur garde la meilleure définition plutôt que de descendre en 720p).
let camFps = 30;
async function openCamera() {

  if (stream) stream.getTracks().forEach((t) => t.stop());
  micTrack = null; micError = null;
  const ideal = { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 60 } };
  const audio = armed ? MIC : false;
  if (armed) micTried = true;
  const gum = (c) => navigator.mediaDevices.getUserMedia(c);
  try { stream = await gum({ audio, video: ideal }); }
  catch (err) {
    if (err.name === 'OverconstrainedError') {
      try { stream = await gum({ audio, video: true }); }
      catch (e2) { if (!audio) throw e2; micError = e2.name; stream = await gum({ audio: false, video: true }); }
    } else if (audio) {
      micError = err.name;
      stream = await gum({ audio: false, video: ideal }); // fails too: the camera itself is refused
    } else throw err;
  }

  levelSource();
  if (armed) tellMic();
  const track = stream.getVideoTracks()[0];
  try { track.contentHint = 'motion'; } catch (_) {}
  await upTo60(track);
  const s = track.getSettings();
  if (s.facingMode === 'user' || s.facingMode === 'environment') facing = s.facingMode;
  camFps = Math.max(1, Math.min(60, Math.round(s.frameRate || 30)));
  $('fmt').textContent = s.width && s.height ? T('{w}x{h} · {fps} fps', { w: s.width, h: s.height, fps: camFps }) : '';
  $('preview').srcObject = new MediaStream([track]);
  $('preview').classList.toggle('mirror', facing === 'user');
  // Page mise en arrière-plan : le navigateur coupe la caméra ; on la rouvre au retour.
  track.addEventListener('ended', () => { if (want && document.visibilityState === 'visible') recover(); });
  if (sender) await sender.replaceTrack(track).then(tuneSender).catch(() => {});
  forceKey = true;
  sendFacing();
  return track;
}
// The browser often picks 1080p at 30 frames per second over 720p at 60. The same camera is asked again for at least
// 50 frames per second, never below 720p; if it cannot, it keeps what it gave.
async function upTo60(track) {
  const s0 = track.getSettings();
  if ((s0.frameRate || 0) >= 50 || !track.applyConstraints) return;
  let max = 0;
  try { const c = track.getCapabilities ? track.getCapabilities() : {}; max = (c.frameRate && c.frameRate.max) || 0; } catch (_) {}
  if (max && max < 50) return;
  try {
    await track.applyConstraints({ width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { min: 50, ideal: 60 } });
    const s = track.getSettings();
    if (Math.max(s.width || 0, s.height || 0) < 1280) await track.applyConstraints({ width: { ideal: s0.width || 1920 }, height: { ideal: s0.height || 1080 }, frameRate: { ideal: s0.frameRate || 30 } });
  } catch (_) {}
}
// Image envoyée seulement si la caméra tourne vraiment et que la page est à l'écran (un onglet resté en
// arrière-plan n'envoie pas une image figée).
function cameraLive() {
  const t = stream && stream.getVideoTracks()[0];
  return !!t && t.readyState === 'live' && !t.muted && document.visibilityState === 'visible';
}
async function post(path, blob) {
  const res = await fetch(path, { method: 'POST', cache: 'no-store', body: blob || '',
    headers: { 'content-type': blob ? 'image/jpeg' : 'text/plain', 'x-carnet-code': token, 'x-carnet-facing': facing, 'x-carnet-v': String(PAGE_VERSION) } });
  if (res.status === 403) throw Object.assign(new Error('code'), { code: 'bad-token' });
  if (res.status === 409) { reloadPage(); throw Object.assign(new Error('reload'), { code: 'reload' }); }
  if (!res.ok) throw new Error('HTTP ' + res.status);
  let j = {};
  try { j = await res.json(); } catch (_) {}
  if (j && Array.isArray(j.msgs)) j.msgs.forEach(handleMsg); // orders from Carnet while the WebSocket is down
  return j;
}

// ---------- Chemin de secours : WebSocket ----------
let ws = null, wsOpen = false, wsFails = 0, wsTimer = null, transport = 'ws'; // transport : 'ws' ou 'post'
function connectWs() {

  let opened = false, s;
  try { s = new WebSocket(`wss://${location.host}/api/ws?t=${encodeURIComponent(token)}&v=${PAGE_VERSION}`); }
  catch (_) { wsFails++; wsRetry(false); return; }
  s.binaryType = 'arraybuffer';
  ws = s;
  const guard = setTimeout(() => { if (!opened) { try { s.close(); } catch (_) {} } }, 6000);
  s.onopen = () => {
    clearTimeout(guard);
    if (ws !== s) return;
    opened = true; wsOpen = true; wsFails = 0; forceKey = true; inflight.length = 0;
    transport = 'ws';
    s.send(JSON.stringify({ type: 'facing', facing }));
    overlay('');
    if (mode !== 'direct') showStatus();
  };
  s.onmessage = (ev) => {
    if (typeof ev.data !== 'string') return;
    let m;
    try { m = JSON.parse(ev.data); } catch (_) { return; }
    if (m.type === 'ack') { ackSeen = true; acked(m.ts); }
    else if (m.type === 'key') forceKey = true;
    // Carnet ne sait pas lire ce format : on passe au suivant (H.264 -> VP8 -> images JPEG).
    else if (m.type === 'codec-error' && encBase) {
      (encBase.startsWith('avc1') ? ['avc1.42E0', 'avc1.4D40'] : [encBase]).forEach((c) => failedCodecs.add(c));
      closeEncoder(); encBase = '';
    }
    else handleMsg(m);
  };

  s.onclose = (ev) => {
    clearTimeout(guard);
    if (ws !== s) return;
    ws = null; wsOpen = false; inflight.length = 0;
    if (!want) return;
    // Une autre page envoie déjà l'image à Carnet (autre onglet, autre téléphone) : on attend son tour.
    if (ev.code === 4001) {
      status(T('Another page is already sending the picture'), 'warn');
      wsTimer = setTimeout(connectWs, 2000);

    }
    if (!opened) wsFails++;
    wsRetry(opened);
  };
}
function wsRetry(wasOpen) {
  if (!want) return;

  if (wsFails >= 2 && transport !== 'post') { transport = 'post'; postLoop(); }
  if (transport === 'ws' && mode !== 'direct') status(T('Reconnecting…'), 'warn');
  clearTimeout(wsTimer);
  wsTimer = setTimeout(connectWs, wasOpen ? 300 : Math.min(15000, 1000 * 2 ** Math.min(wsFails, 4)));

// Vidéo compressée par le téléphone (WebCodecs). L'image de la caméra passe par un canevas : orientation et
// taille toujours justes, quel que soit le téléphone.
const ecanvas = document.createElement('canvas');
const ectx = ecanvas.getContext('2d', { alpha: false });
const LEVELS = [1, 0.6, 0.36, 0.22];   // débit plein, puis réduit si le Wi-Fi ne suit pas
let enc = null, encBase = '', encCodec = '', encDecCodec = '', encCfg = null, encW = 0, encH = 0, encDesc = null, encSetup = null;
let encLevel = 0, forceKey = true, lastKeyAt = 0, useJpeg = false;
const failedCodecs = new Set();
let sent = 0, skipped = 0, skippedEnc = 0, statAt = 0, calmSince = 0, upWait = 20000;
// Encoder too slow for 60 frames per second (phone without hardware encoding): the picture gets smaller first (1280,
// then 960, then 640 pixels on the long side) to keep 60; only below that, one frame out of two (30 steady rather
// than 45 in fits and starts).
const SIDES = [1280, 960, 640];
let sideIdx = 0, settleUntil = 0, slowWindows = 0;

const encFps = () => (half ? Math.round(camFps / 2) : camFps);
// Images envoyées mais pas encore reçues par Carnet (il accuse réception de chacune). Si la plus ancienne attend
// trop, le Wi-Fi ne suit pas : on saute des images au lieu de laisser le retard grandir, et le débit baisse.
const inflight = [];

function acked(ts) { while (inflight.length && inflight[0] <= ts) inflight.shift(); }

  if (!ackSeen && age > 3000) { inflight.length = 0; return 0; } // pas d'accusés : on ne s'y fie pas
  return age;
}
// Taille envoyée : celle de la caméra, plafonnée à 1280 pixels de côté (720p), à la cadence de la caméra (30 ou
// 60 images par seconde) : fluide sur un Wi-Fi moyen, léger à décoder pour l'ordinateur. En nombres pairs.
// While this phone records, the picture shown in Carnet is only for framing: smaller and lighter, so that the phone's
// encoder and the Wi-Fi keep their strength for the recording.

  if (!w || !h) return null;

    if (failedCodecs.has(base)) continue;

          error: () => { if (enc === e) { failedCodecs.add(base); enc = null; } },

// Une image par image de la caméra (pas deux fois la même).

// Toutes les 2 s : si trop d'images sont sautées, débit (ou qualité JPEG) réduit. Il remonte après un moment

// Images JPEG : quand le navigateur ne sait pas compresser en vidéo, ou par HTTPS si le WebSocket ne passe pas.
const rcanvas = document.createElement('canvas');
const rctx = rcanvas.getContext('2d');

  if (!recCur && !recs.size && !recShown && $('recNote').classList.contains('hidden')) return;
  const shown = recUi();
  if (!shown && recShown) {
    if (!want) status(T('Stopped'), '');
    else if (wsOpen || mode === 'direct' || (transport === 'post' && postRunning)) showStatus();
    else status(T('Reconnecting…'), 'warn');
  }
  recShown = shown;
}, 500);
// Pieces not yet written by Carnet, also kept in the browser's storage (a reload of the page loses nothing).
const idb = (() => {
  let opening = null;
  const open = () => opening || (opening = new Promise((resolve) => {
    try {
      const q = indexedDB.open('carnet-recordings', 1);
      q.onupgradeneeded = () => { q.result.createObjectStore('chunks'); q.result.createObjectStore('recs'); };
      q.onsuccess = () => resolve(q.result);
      q.onerror = q.onblocked = () => resolve(null);
    } catch (_) { resolve(null); }
  }));
  const run = async (store, fn) => {
    const db = await open();
    if (!db) return null;
    return new Promise((resolve) => {
      try {
        const tx = db.transaction(store, 'readwrite');
        const req = fn(tx.objectStore(store));
        tx.oncomplete = () => resolve(req ? req.result : null);
        tx.onerror = tx.onabort = () => resolve(null);
      } catch (_) { resolve(null); }
    });
  };
  const range = (id) => IDBKeyRange.bound(id + ':', id + ':￿');
  return {
    putChunk: (id, seq, blob) => run('chunks', (s) => s.put(blob, id + ':' + seq)),
    delChunk: (id, seq) => run('chunks', (s) => s.delete(id + ':' + seq)),
    putRec: (m) => run('recs', (s) => s.put(m, m.id)),
    async delRec(id) { await run('chunks', (s) => s.delete(range(id))); await run('recs', (s) => s.delete(id)); },
    async load() {
      const out = [];
      for (const m of (await run('recs', (s) => s.getAll())) || []) {
        const keys = (await run('chunks', (s) => s.getAllKeys(range(m.id)))) || [];
        const vals = (await run('chunks', (s) => s.getAll(range(m.id)))) || [];
        const chunks = new Map();
        keys.forEach((k, i) => { const seq = Number(String(k).split(':').pop()); if (vals[i] && Number.isFinite(seq)) chunks.set(seq, vals[i]); });
        out.push({ meta: m, chunks });
      }
      return out;
    },
  };
})();

// ---------- Démarrage, arrêt ----------
function closeWs() {
  clearTimeout(wsTimer); wsTimer = null;
  if (ws) { const s = ws; ws = null; wsOpen = false; try { s.close(); } catch (_) {} }
}
function badToken() {
  want = false;
  clearTimeout(directTimer); directTimer = null;
  closeWs(); closeEncoder();
  teardown();
  status(T('Code expired'), 'bad');
  overlay(T('This QR code is no longer valid. Scan the one Carnet shows on the computer right now.'));
  buttons();
}
async function start(auto) {
  if (!token) { overlay(T('Incomplete address: scan the QR code shown by Carnet on the computer.')); return; }
  $('btnStart').disabled = true;
  try { await openCamera(); }
  catch (err) {
    $('btnStart').disabled = false;
    if (auto === true) return; // démarrage automatique refusé par le navigateur : il reste le bouton
    status(T('Camera refused'), 'bad');
    overlay(err.name === 'NotAllowedError'
      ? T('The browser is not allowed to use the camera. Allow the camera for this page (icon to the left of the address), then try again.')
      : T('The camera does not start ({name}). Close the other apps using it, then try again.', { name: err.name }));
    return;
  }
  want = true;
  mode = 'secours'; directAttempts = 0; directConfirm = 0;
  wsFails = 0; transport = 'ws'; useJpeg = false; failedCodecs.clear(); encLevel = 0; upWait = 20000; quality = 0.78; forceKey = true; half = false; sideIdx = 0; slowWindows = 0;
  overlay('');
  buttons();
  status(T('Connecting…'), 'warn');
  requestWakeLock();
  connectWs();
  startFrames();
  statusLoop();
  tryDirect();
}
function stop() {
  if (recCur) recStop('phone');
  want = false;
  clearTimeout(directTimer); directTimer = null;
  closeWs(); closeEncoder();
  teardown();
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = null;
  $('preview').srcObject = null;
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  status(T('Stopped'), '');
  overlay(T('Camera stopped. Press <b>Start camera</b> to resume.'));
  buttons();
}
function buttons() {
  $('btnStart').disabled = false;
  $('btnStart').classList.toggle('hidden', want);
  $('btnFlip').classList.toggle('hidden', !want);
  $('btnStop').classList.toggle('hidden', !want);
  // While this phone records: no camera switch (it would cut the recording), and Stop ends the recording only.
  $('btnFlip').disabled = !!recCur;
  $('btnStop').textContent = recCur ? T('Stop recording') : T('Stop');
}
async function requestWakeLock() {
  try { wakeLock = navigator.wakeLock ? await navigator.wakeLock.request('screen') : null; } catch (_) {}
}
async function recover() {
  if (!want) return;
  const t = stream && stream.getVideoTracks()[0];
  if (!t || t.readyState !== 'live') {
    // The camera was cut (page hidden, screen locked): a recording ends there; what it holds is sent.
    if (recCur) recStop('interrupted');
    try { await openCamera(); } catch (_) {}
  }
  forceKey = true;
  startFrames();
  if (!ws) connectWs();
  if (transport === 'post') postLoop();
  statusLoop();
  if (!pc || pc.connectionState !== 'connected') { clearTimeout(directTimer); directTimer = null; tryDirect(); }
}
// Page cachée (autre onglet, autre appli, écran verrouillé) : le navigateur coupe la caméra ; on libère aussi la
// connexion, pour qu'un onglet oublié en arrière-plan ne la dispute pas à celui qui filme. Tout repart au retour.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { requestWakeLock(); recover(); return; }
  if (!want) return;
  closeWs();
  clearTimeout(directTimer); directTimer = null;
  teardown();
});
// Filet de sécurité : si les images de la caméra ne sont plus suivies, on reprend.
setInterval(() => { if (want && cameraLive() && performance.now() - lastStep > 1500) startFrames(); }, 1000);
$('preview').addEventListener('resize', () => { if (want) sendFacing(); });
$('btnStart').onclick = () => { audioReady(); start(false); };
$('btnStop').onclick = () => { if (recCur) recStop('phone'); else stop(); };
$('btnFlip').onclick = async () => {
  if (recCur) return;
  $('btnFlip').disabled = true;
  const before = facing;
  facing = facing === 'user' ? 'environment' : 'user';
  try { await openCamera(); } catch (_) { facing = before; try { await openCamera(); } catch (_) {} }
  if (want) startFrames();
  $('btnFlip').disabled = false;
};
if (!token) overlay(T('Incomplete address: scan the QR code shown by Carnet on the computer.'));
else {
  // Carnet was already asking this phone to record when the page was served: the microphone opens with the camera.
  if (I18N_.armed) { armed = true; armedAt = Date.now(); }
  loadPending(); // a recording not fully sent before the page was closed or reloaded
  // Page rechargée (nouvelle version de Carnet, ou rechargement à la main) : la caméra redémarre toute seule.
  let auto = false;
  try { auto = sessionStorage.getItem('carnet.autostart') === '1'; sessionStorage.removeItem('carnet.autostart'); } catch (_) {}
  const nav = performance.getEntriesByType ? performance.getEntriesByType('navigation')[0] : null;
  if (auto || (nav && nav.type === 'reload')) start(true);
}
</script>
